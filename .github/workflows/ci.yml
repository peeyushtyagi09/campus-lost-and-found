name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore server/LostAndFound.sln

      - name: Build
        run: dotnet build server/LostAndFound.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test server/LostAndFound.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage
          if-no-files-found: error

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
