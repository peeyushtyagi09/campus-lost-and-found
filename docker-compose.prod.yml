name: campus-lost-and-found-prod

services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./server
      dockerfile: src/LostAndFound.Api/Dockerfile
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING}
      Mongo__DatabaseName: ${MONGO_DATABASE_NAME}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      Encryption__Key: ${ENCRYPTION_KEY}
      Storage__UploadPath: ${STORAGE_UPLOAD_PATH}
      Storage__MaxPhotoBytes: ${STORAGE_MAX_PHOTO_BYTES}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      RateLimiting__AuthPermitLimit: ${RATE_LIMIT_AUTH_PERMIT}
      RateLimiting__UploadPermitLimit: ${RATE_LIMIT_UPLOAD_PERMIT}
      RateLimiting__GlobalPermitLimit: ${RATE_LIMIT_GLOBAL_PERMIT}
      RateLimiting__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS}
      Retention__DisposalDays: ${RETENTION_DISPOSAL_DAYS:-90}
      Retention__ExpiredAccountDays: ${RETENTION_EXPIRED_ACCOUNT_DAYS:-365}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-noreply@campus.edu}
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: always
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      - api
    ports:
      - "${CLIENT_PORT:-80}:80"

volumes:
  mongo_data:
  uploads_data:
